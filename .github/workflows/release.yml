name: Release

# 推送 v 开头的标签触发：git tag v0.1.0 && git push origin v0.1.0
# Windows runner 上完成 mvnw package + jlink（Windows JRE）+ electron-vite + NSIS，
# 产物上传到【草稿】Release，检查无误后在 GitHub 页面手动 Publish。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/aye-frontend/pnpm-lock.yaml

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw 'Release must run from a version tag.'
          }
          $version = (Get-Content apps/aye-desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must match the desktop package version.'
          }

      - name: Run backend tests
        run: .\mvnw.cmd -B -ntp test

      # electron-vite 的 renderer 段以 apps/aye-frontend 为 root 编译。
      - name: Install frontend dependencies
        working-directory: apps/aye-frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: apps/aye-desktop
        run: npm ci

      - name: Type-check and build frontend
        working-directory: apps/aye-frontend
        run: pnpm build

      - name: Build installer (mvnw + jlink + electron-vite + electron-builder)
        working-directory: apps/aye-desktop
        run: npm run dist

      - name: Normalize asset names
        # latest.yml 中的 path 用横杠命名（Aye-Setup-<ver>.exe），
        # electron-updater 按该名下载；本地产物名含空格，必须先重命名，
        # 否则 GitHub Release 资产名与 latest.yml 不匹配，自动更新 404。
        working-directory: apps/aye-desktop/dist
        shell: pwsh
        run: |
          $assetName = ((Get-Content latest.yml | Select-String 'path: (.+)').Matches.Groups[1].Value).Trim()
          $exe = (Get-ChildItem 'Aye Setup *.exe').Name
          Copy-Item $exe $assetName
          Copy-Item "$exe.blockmap" "$assetName.blockmap"
          Get-ChildItem $assetName, "$assetName.blockmap", latest.yml | Select-Object Name, Length

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            apps/aye-desktop/dist/Aye-Setup-*.exe
            apps/aye-desktop/dist/Aye-Setup-*.exe.blockmap
            apps/aye-desktop/dist/latest.yml
