appId: com.aye.app
productName: Aye
copyright: Copyright © 2026 aye-aye contributors
asar: true
# 动态更新源（electron-updater GitHub provider）：
# 打包时写入 resources/app-update.yml，客户端启动后通过 GitHub Releases API
# 读取最新 Release 中的 latest.yml 比对版本；安装包与 blockmap 也从 Release 下载。
# release.yml 在推送 v* 标签时自动构建并创建草稿 Release。
publish:
  - provider: github
    owner: WuJunNan-fjy
    repo: aye-aye
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - build/icon.ico
  - build/icon.png
extraResources:
  # 后端 jar 与 jlink 运行时由 scripts/prepare-backend.cjs 生成，只走 extraResources（asar 外，java 进程可直接读）
  - from: build/backend
    to: backend
    filter:
      - '**/*'
  - from: build/runtime
    to: runtime
    filter:
      - '**/*'
  - from: build/icon.ico
    to: build/icon.ico
  - from: build/icon.png
    to: build/icon.png
# v0.1.0 首发仅 Windows x64：
# jlink 只能产出构建机所在平台的 JRE，mac dmg / linux AppImage 必须分别在
# macOS / Linux runner 上构建（未来用三平台 matrix 扩展，届时再补 mac/linux 段与 icon.icns）。
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aye
  uninstallDisplayName: Aye
  deleteAppDataOnUninstall: false
  # 安装/卸载前清理驻留的 Aye 与内置 java 进程，避免 server.jar 文件锁
  include: build/installer.nsh
